name: NOVA VPN CI

on:
  push:
    paths:
      - "app/**"
      - "backend/**"
      - ".github/workflows/**"
      - ".github/workflows-build-main.yml"
  pull_request:
    paths:
      - "app/**"
      - "backend/**"
      - ".github/workflows/**"
      - ".github/workflows-build-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  android:
    name: Flutter checks and Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files when absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org=com.novavpn --project-name=app --no-pub .
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter project
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Verify deployed API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "::error::Set the repository variable API_BASE_URL to the deployed HTTPS backend URL."
            exit 1
          fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::API_BASE_URL must use HTTPS."
            exit 1
          fi
      - name: Build Android debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-vpn-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
