name: nova_vpn_app
description: NOVA VPN Android client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_v2ray_client:
    git:
      url: https://github.com/mynovavpnproxy1/flutter_v2ray_client.git
      ref: 138faaddc216ef2b2960a0acd265151f065234e3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/nova_logo_dark.png
    - assets/brand/nova_logo_light.png
